# Stateless web tier — safe at any replica count because every piece of
# draw/streak/reward/deck state lives in Postgres behind row locks, and the
# daily deck publish is serialized with a pg advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhagya-card
  labels:
    app: bhagya-card
    role: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhagya-card
      role: web
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bhagya-card
        role: web
    spec:
      containers:
        - name: web
          image: your-registry/bhagya-card:latest # set by CI
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: EXPERIMENT_CONFIG_PATH
              value: /etc/bhagya-card/experiment.config.json
          envFrom:
            - secretRef:
                name: bhagya-card-secrets
          volumeMounts:
            - name: experiment-config
              mountPath: /etc/bhagya-card
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: experiment-config
          configMap:
            name: bhagya-card-config
---
apiVersion: v1
kind: Service
metadata:
  name: bhagya-card
  labels:
    app: bhagya-card
spec:
  selector:
    app: bhagya-card
    role: web
  ports:
    - port: 80
      targetPort: 3000
