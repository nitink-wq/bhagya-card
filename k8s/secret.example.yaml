# Template only — never commit a real secret. On Devtron use the GUI secret
# ({project}-{app} naming) with envFrom into the workload instead.
apiVersion: v1
kind: Secret
metadata:
  name: bhagya-card-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://user:pass@host:5432/bhagyacard
  PGSSL: require
  COIN_API_URL: https://dev-api.astrolokal.com/v1/system-transactions/
  COIN_API_USER: replace-me
  COIN_API_PASS: replace-me
  GEMINI_API_KEY: replace-me
